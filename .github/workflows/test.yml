name: Tests

# One run per commit (owner, Nov 7): a pull request runs on pull_request only, main runs on push; a branch push alone never runs (it would repeat the pull request's run).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # DATE GUARD: the same tests again as if today were New Year, a leap day and other days (tools/test-dates.mjs)
      - run: npm run test:dates

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The e2e scripts load Playwright from the global npm folder (e2e/engine.mjs) and start their own Chromium.
      # Playwright 1.64.1 was published on 2026-10-14; the version is pinned here and in webkit.yml, and the two must stay equal (tests/webkit-ci.test.js).
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Serve the repository
        run: |
          python3 -m http.server 8124 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fs http://localhost:8124/app/index.html >/dev/null && exit 0; sleep 1; done
          echo "the local server did not start"; exit 1
      - name: Run the full e2e suite
        shell: bash
        run: |
          node e2e/pdf-scan.mjs
          node e2e/spending-details.mjs
          node e2e/payslip-items.mjs
          node e2e/ledger-check.mjs
          node e2e/ui-audit.mjs
          node e2e/trial-isolation.mjs
          node e2e/photo-payslip.mjs
          node e2e/reader-fixture.mjs
          node e2e/tap-safety.mjs
          node e2e/two-windows.mjs
          node e2e/logo-privacy.mjs
          node e2e/amounts.mjs
          node e2e/network.mjs
          node e2e/buffer-line.mjs
          node e2e/sheet-scroll.mjs
          node e2e/run.mjs 2>&1 | tee e2e.log
      - name: Pass count
        if: always()
        shell: bash
        run: |
          passed=$(grep -c '^  ok ' e2e.log || true)
          failed=$(grep -c '^  FAIL ' e2e.log || true)
          echo "e2e: ${passed} checks passed, ${failed} failed"
          echo "### e2e: ${passed} checks passed, ${failed} failed" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: e2e.log
