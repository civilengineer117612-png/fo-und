name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  # BUILD, then DEPLOY in its own job (Nov 24): uploading and publishing in ONE job failed three times on the 1.1.0 release: the publish step asked
  # for the upload one second after it finished and GitHub's list of uploads did not show it yet ("No artifacts named github-pages"; the upload
  # was there when listed afterwards). A separate job starts only after the upload job has finished, which is GitHub's own layout for Pages.
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the site files
        run: |
          mkdir -p _site/app _site/src
          # The site root only forwards to the app (the storage test is finished); sw.js there retires the old probe worker.
          cp index.html sw.js _site/
          # The finance app and the model code it imports live under /app and /src.
          cp -r app/* _site/app/
          cp -r src/model _site/src/model
          # The on-phone photo reader (open-source, copied unchanged) is served from this site too, so a photo is never sent elsewhere.
          cp -r src/vendor _site/src/vendor
          # A new version stamp per deploy makes every phone install the fresh offline worker.
          sed -i "s/__VERSION__/${GITHUB_SHA::12}/" _site/app/sw.js
          # The version and date Setup shows ("Version abc1234, updated Oct 5, 2026").
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/; s/__BUILT_ON__/$(TZ=Asia/Manila date +%F)/" _site/src/model/version.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # One more try after a short wait, only when the first could not find the upload (never a loop).
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
