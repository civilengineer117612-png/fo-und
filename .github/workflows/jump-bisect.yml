name: Jump bisect
# TEMPORARY (Nov 16, the owner's bisect of the WebKit window jump). Removed after the bisect; never merged.
# Owner's two stages: (1) every machine runs MAIN only, 20 rounds; (2) only the machine where main failed most runs every variant
# interleaved, 60 rounds. Pass: main fails there in the same session and the fix gets 0 of 60. Cap: main under 5 of 60 there = report and stop.
on:
  push:
    branches: [claude/serene-wright-3i0dga]
permissions:
  actions: read
  contents: read
jobs:
  jump:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        machine: [1, 2, 3, 4, 5]
    env:
      ENGINE: webkit
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { path: tools }
      - uses: actions/checkout@v4
        with: { ref: e8e37d09b94ce8482e31f9a62a533620d8eca3a7, path: srv/m }
      - uses: actions/checkout@v4
        with: { ref: 7dbe7cd8f5eb6ef7ba3f14a4b9335e23ff5943a5, path: srv/a1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g playwright@1.64.1 && npx playwright install --with-deps webkit
      - name: Make the variants and serve them
        working-directory: srv
        run: |
          for v in no-transform no-press will-change base-transform no-active-duration; do
            cp -r m "$v" && rm -rf "$v/.git" && (cd "$v" && node ../../tools/.github/bisect/patch.mjs "$v")
          done
          cp ../tools/.github/bisect/jump.mjs m/e2e/jump-bisect.mjs
          python3 -m http.server 8124 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fs http://localhost:8124/m/app/index.html >/dev/null && exit 0; sleep 1; done; exit 1
      - name: Stage 1, main only, 20 rounds on this machine
        working-directory: srv/m
        env: { ROUNDS: "20", NODE_PATH: /usr/local/lib/node_modules, VARIANTS: "main=m", RESULT_FILE: /tmp/stage1.json }
        run: |
          node e2e/jump-bisect.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          n=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/stage1.json","utf8")).main)')
          echo "STAGE1 machine ${{ matrix.machine }}: main jumped $n of 20" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/s1 && echo "$n" > /tmp/s1/count
      - uses: actions/upload-artifact@v4
        with: { name: "stage1-${{ matrix.machine }}", path: /tmp/s1/count }
      - name: Wait for every machine's stage 1, keep the one where main failed most
        id: pick
        run: |
          for i in $(seq 1 120); do
            names=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '[.artifacts[].name | select(startswith("stage1-"))] | length')
            [ "$names" -ge 5 ] && break; sleep 10
          done
          best=0; bestn=-1
          for k in 1 2 3 4 5; do
            id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq ".artifacts[] | select(.name==\"stage1-$k\") | .id")
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > /tmp/a$k.zip && n=$(unzip -p /tmp/a$k.zip count)
            echo "machine $k: main jumped $n of 20"
            if [ "$n" -gt "$bestn" ]; then best=$k; bestn=$n; fi
          done
          echo "STAGE1 kept machine $best (main jumped $bestn of 20)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "best=$best" >> "$GITHUB_OUTPUT"
      - name: Stage 2, every variant interleaved, 60 rounds (only the kept machine)
        if: steps.pick.outputs.best == matrix.machine
        working-directory: srv/m
        env:
          ROUNDS: "60"
          NODE_PATH: /usr/local/lib/node_modules
          VARIANTS: "main=m;before ONE PRESS (#356)=a1;all ONE PRESS off=no-press;no shrink=no-transform;will-change=will-change;scale(1) at rest=base-transform;shrink without the 70ms press timing=no-active-duration"
        run: node e2e/jump-bisect.mjs | tee -a "$GITHUB_STEP_SUMMARY"
